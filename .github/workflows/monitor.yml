name: Scopus & Retraction Watch Alert Bot

on:
  # Chạy tự động mỗi ngày vào lúc 07:30 sáng giờ Việt Nam (00:30 UTC)
  schedule:
    - cron: '30 0 * * *'
  # Cho phép bấm nút "Run workflow" chạy thủ công hoặc nhập tên tạp chí/ISSN để tra cứu ngay
  workflow_dispatch:
    inputs:
      lookup_query:
        description: 'Nhập Tên tạp chí hoặc mã ISSN cần kiểm tra Discontinued (để trống nếu chỉ quét định kỳ)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitor & Lookup Script
        env:
          # Cấu hình Zalo Bot (lấy từ https://bot.zaloplatforms.com)
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          # Cấu hình Telegram Bot (tùy chọn)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Từ khóa tra cứu tạp chí (nếu nhập khi bấm Run workflow)
          LOOKUP_QUERY: ${{ github.event.inputs.lookup_query }}
        run: |
          python monitor.py

      - name: Save updated state & lookup index back to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json discontinued_lookup.json
          git diff --staged --quiet || git commit -m "chore: update tracking state and discontinued lookup db [skip ci]"
          git push
