name: Scopus & Retraction Watch Alert Bot

on:
  # Chạy tự động mỗi ngày vào lúc 07:30 sáng giờ Việt Nam (00:30 UTC)
  schedule:
    - cron: '30 0 * * *'
  # Cho phép bấm nút "Run workflow" chạy thủ công bất cứ lúc nào trên giao diện GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitor Script
        env:
          # Cấu hình Zalo Bot (lấy từ https://bot.zaloplatforms.com)
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          # Cấu hình Telegram Bot (tùy chọn - điền bên nào gửi bên đó, điền cả 2 gửi cả 2)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save updated state back to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update tracking state [skip ci]"
          git push
